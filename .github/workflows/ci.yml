name: CI micro apps

on:
  pull_request:
  push:
    branches: [main]

jobs:
  asistencia-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 03-asistencia-rrhh/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 03-asistencia-rrhh/backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  asistencia-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 03-asistencia-rrhh/frontend } }
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 03-asistencia-rrhh/frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  asistencia-mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 03-asistencia-rrhh/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 03-asistencia-rrhh/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: node scripts/db-sync.mjs
      - run: supabase db start
      - run: supabase test db
